<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Karaoke adapter test fixture</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; }
        .guest-header-actions { display: flex; gap: .75rem; }
        .guest-header, .mobile-tabs, main { padding: 16px; }
        .mobile-tabs { display: flex; gap: 8px; }
        .mobile-tab { min-height: 48px; }
        .active { background: #b9e9d2; }
        .guest-main { min-height: 400px; }
        .queue-section { min-height: 280px; }
        .playlist-item { min-height: 64px; }
        .playlist-item-row { display: flex; align-items: center; gap: 12px; }
        .playlist-thumb { width: 64px; height: 48px; object-fit: cover; }
        .playlist-list { padding: 0; list-style: none; }
        .mobile-hidden { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script>
        history.replaceState({ idx: 0 }, "", location.href);
        const root = document.querySelector("#root");
        const sessionKeys = ["authToken", "authLevel", "usernameRequired", "memberName", "memberId", "memberRole"];
        async function request(path, { transport = "fetch", method = "GET", body, token } = {}) {
            const headers = { "Content-Type": "application/json" };
            if (token) headers.Authorization = ["Bearer", token].join(" ");
            let status;
            let data;
            if (transport === "xhr") {
                ({ status, data } = await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open(method, "/api" + path);
                    for (const [key, value] of Object.entries(headers)) xhr.setRequestHeader(key, value);
                    xhr.onloadend = () => resolve({ status: xhr.status, data: JSON.parse(xhr.responseText || "{}") });
                    xhr.onerror = xhr.ontimeout = xhr.onabort = () => reject(new Error("Network failure"));
                    xhr.send(body === undefined ? null : JSON.stringify(body));
                }));
            } else {
                const response = await fetch("/api" + path, {
                    method, headers, body: body === undefined ? undefined : JSON.stringify(body)
                });
                status = response.status;
                data = await response.json();
            }
            if (status < 200 || status >= 300) throw Object.assign(new Error(data.error || "Request failed"), { status });
            return data;
        }
        // Match AuthContext's ordering: the native adapter must checkpoint before UI/view restoration.
        function persistSession(value) {
            sessionStorage.setItem("authToken", value.token);
            sessionStorage.setItem("authLevel", value.level);
            if (value.user?.name) localStorage.setItem("defaultUsername", value.user.name);
        }
        function clearSession() {
            for (const key of sessionKeys) sessionStorage.removeItem(key);
            render();
        }
        async function rehydrate(transport = "fetch") {
            const token = sessionStorage.getItem("authToken");
            if (!token) return;
            try {
                const data = await request("/auth/me", { transport, token });
                if (sessionStorage.getItem("authToken") === token) {
                    persistSession({ ...data, token });
                    render();
                }
            } catch (_) {
                if (sessionStorage.getItem("authToken") === token) clearSession();
            }
        }
        async function ceremony(kind, { name, transport = "fetch", cancelled = false } = {}) {
            try {
                const token = kind === "passkeys" ? sessionStorage.getItem("authToken") : undefined;
                const { requestId } = await request(`/auth/${kind}/options`, {
                    method: "POST", transport, token, body: name ? { name } : {}
                });
                if (cancelled) throw new DOMException("Passkey cancelled", "NotAllowedError");
                const result = await request(`/auth/${kind}/verify`, {
                    method: "POST", transport, token, body: { requestId, response: { id: "fixture-passkey", type: "public-key" } }
                });
                if (result.token) {
                    persistSession(result);
                    render();
                }
                return result.pending ? "pending" : true;
            } catch (_) {
                return false;
            }
        }
        async function joinInvitation(invitation, name) {
            const details = await request("/parties/invitations/resolve", { method: "POST", body: { invitation } });
            const result = await request(`/parties/${details.party.id}/join`, { method: "POST", body: { invitation, name } });
            if (!result.token || result.level !== "guest" || !result.partyId || !result.memberId) throw new Error("Invalid party session");
            persistSession(result);
            sessionStorage.setItem("memberName", result.member.name);
            sessionStorage.setItem("memberId", result.member.id);
            sessionStorage.setItem("memberRole", "guest");
            history.replaceState({}, "", `/guest/${result.partyId}/${result.memberId}`);
            render();
        }
        async function logout() {
            const token = sessionStorage.getItem("authToken");
            try {
                if (token) await request("/auth/logout", { method: "POST", token, body: {} });
            } catch (error) {
                if (error.status !== 401) return false;
            }
            clearSession();
            history.replaceState({}, "", "/");
            return true;
        }
        window.addEventListener("auth:expired", clearSession);
        window.fixtureAuth = { request, persistSession, clearSession, rehydrate, ceremony, joinInvitation, logout };
        function render() {
            if (!sessionStorage.getItem("authToken")) {
                root.innerHTML = '<section class="passkey-panel"><h1>Sign in with a passkey</h1><button>Sign in</button></section>';
                return;
            }
            if (location.pathname === "/account") {
                root.innerHTML = '<main class="account-page"><h1></h1><button class="sign-out">Sign out</button><h2>Passkeys</h2></main>';
                root.querySelector("h1").textContent = localStorage.getItem("defaultUsername") || "Account";
                root.querySelector(".sign-out").addEventListener("click", logout);
                return;
            }
            root.innerHTML = '<div class="guest-layout"><header class="guest-header">Fixture party <span class="member-badge"></span><div class="guest-header-actions"><div class="theme-picker"><button>Theme</button></div><button class="sign-out">Sign out</button></div></header><nav class="mobile-tabs"><button class="mobile-tab active">Search</button><button class="mobile-tab">Queue</button><button class="mobile-tab">Status</button></nav><main class="guest-main"><section class="search-section"><input aria-label="Search songs"><p>Search results</p></section><section class="queue-section mobile-hidden"><ul class="playlist-list"><li class="playlist-item"><div class="playlist-item-row"><div class="drag-handle" role="button" tabindex="0">::</div><img class="playlist-thumb" src="/test-icon.png" alt="Song artwork"><span class="playlist-title">City Lights</span></div></li></ul></section></main></div>';
            root.querySelector(".sign-out").addEventListener("click", logout);
            root.querySelector(".member-badge").textContent = sessionStorage.getItem("memberName") || "Guest";
            root.querySelectorAll(".mobile-tab").forEach(button => button.addEventListener("click", () => {
                root.querySelectorAll(".mobile-tab").forEach(item => item.classList.toggle("active", item === button));
                root.querySelector(".queue-section").classList.toggle("mobile-hidden", button.textContent !== "Queue");
                root.querySelector(".search-section").classList.toggle("mobile-hidden", button.textContent !== "Search");
            }));
        }
        if (sessionStorage.getItem("authToken")) rehydrate();
        else render();
    </script>
</body>
</html>
